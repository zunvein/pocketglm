name: build-android-arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet + unit tests
        run: |
          go vet ./...
          go test ./internal/... ./cmd/... 

      - name: Cross-compile bridge (android/arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o zai-api-android-arm64 .

      - name: Smoke test (linux build, same code)
        run: |
          go build -o /tmp/zai-smoke .
          # binary harus jalan minimal beberapa detik tanpa crash; auth bikin dia nunggu
          /tmp/zai-smoke & BPID=$!
          sleep 2
          kill -0 $BPID 2>/dev/null && echo "smoke: alive after 2s"

      - name: Report size + type
        run: |
          ls -la zai-api-android-arm64
          file zai-api-android-arm64 || true

      - uses: actions/upload-artifact@v4
        with:
          name: zai-api-android-arm64
          path: zai-api-android-arm64
          retention-days: 30
