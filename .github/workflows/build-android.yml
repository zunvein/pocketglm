name: build-android-arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet + unit tests
        run: |
          go vet ./...
          go test ./internal/... ./cmd/... 

      - name: Cross-compile bridge (android/arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o zai-api-android-arm64 .

      - name: Smoke test (linux build, same code)
        run: |
          go build -o /tmp/zai-smoke .
          # Bridge exit-1 kalau db gak ada (boot guard) → sediain pool kosong
          # dengan schema valid, jalankan default db-path=tokens.sqlite, cek alive + /health.
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('tokens.sqlite')
          db.execute('CREATE TABLE IF NOT EXISTS tokens (id INTEGER PRIMARY KEY AUTOINCREMENT, token TEXT NOT NULL)')
          db.commit()
          PY
          /tmp/zai-smoke & BPID=$!
          sleep 3
          if ! kill -0 $BPID 2>/dev/null; then echo "smoke FAIL: proses mati duluan"; exit 1; fi
          curl -sf --max-time 5 http://127.0.0.1:3001/health >/dev/null && echo "smoke OK: alive + /health respond" || { echo "smoke FAIL: /health gak respond"; exit 1; }
          kill $BPID 2>/dev/null || true

      - name: Report size + type
        run: |
          ls -la zai-api-android-arm64
          file zai-api-android-arm64 || true

      - uses: actions/upload-artifact@v4
        with:
          name: zai-api-android-arm64
          path: zai-api-android-arm64
          retention-days: 30
