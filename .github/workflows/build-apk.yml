name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet + unit tests
        run: |
          go vet ./...
          go test ./internal/... ./cmd/...

      - name: Cross-compile bridge (android/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/zai-smoke .
          GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o app/app/src/main/jniLibs/arm64-v8a/libzai.so .
          file app/app/src/main/jniLibs/arm64-v8a/libzai.so

      - name: Smoke test (linux build, same code)
        run: |
          go build -o /tmp/zai-smoke .
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('tokens.sqlite')
          db.execute('CREATE TABLE IF NOT EXISTS tokens (id INTEGER PRIMARY KEY AUTOINCREMENT, token TEXT NOT NULL)')
          db.commit()
          PY
          /tmp/zai-smoke & BPID=$!
          # /health answers 503 while the guest session is still warming up,
          # which depends on runner network speed: poll instead of guessing.
          ok=0
          for _ in $(seq 1 30); do
            if ! kill -0 $BPID 2>/dev/null; then echo "smoke FAIL: proses mati duluan"; exit 1; fi
            if curl -sf --max-time 3 http://127.0.0.1:3001/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = 1 ]; then echo "smoke OK: alive + /health respond"; else echo "smoke FAIL: /health gak respond dalam 30 dtk"; exit 1; fi
          kill $BPID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: zai-api-android-arm64
          path: app/app/src/main/jniLibs/arm64-v8a/libzai.so
          retention-days: 30

  apk:
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4

      # Pull the bridge artifact built (and smoke-tested) by the bridge job
      - uses: actions/download-artifact@v4
        with:
          name: zai-api-android-arm64
          path: app/app/src/main/jniLibs/arm64-v8a/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: app

      - name: Decode CI keystore
        env:
          POCKETGLM_KEYSTORE_B64: ${{ secrets.POCKETGLM_KEYSTORE_B64 }}
        run: |
          mkdir -p app/keystore
          printf '%s' "$POCKETGLM_KEYSTORE_B64" | base64 -d > app/keystore/pocketglm.keystore

      - name: Build debug APK (stable CI signing)
        working-directory: app
        env:
          POCKETGLM_KEYSTORE_PASSWORD: ${{ secrets.POCKETGLM_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Report artifact
        working-directory: app
        run: ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGLM-debug-APK
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Public fingerprint of the pinned signing certificate. A build signed
      # with anything else must not be published as an update.
      EXPECTED_CERT_SHA256: 321b71c8dfbebed811b7552b65f5cd180b344b7fcfd809b8b4194242386b491c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PocketGLM-debug-APK
          path: dist

      - name: Publish release
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/app/build.gradle.kts | head -n 1)
          [ -n "$VERSION" ] || { echo "versionName not found"; exit 1; }
          TAG="v${VERSION}"

          APK="dist/PocketGLM-${TAG}.apk"
          mv "$(ls dist/*.apk | head -n 1)" "$APK"

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "signing certificate changed, refusing to publish"
            exit 1
          fi
          APK_SHA=$(sha256sum "$APK" | cut -d' ' -f1)

          {
            if [ -f "docs/releases/${TAG}.md" ]; then
              cat "docs/releases/${TAG}.md"
            else
              echo "No hand-written notes for ${TAG} yet."
            fi
            echo
            echo "---"
            echo
            echo "Build: commit ${GITHUB_SHA::7}, workflow run ${GITHUB_RUN_NUMBER}"
            echo
            echo "APK SHA-256: \`${APK_SHA}\`"
            echo
            echo "Signing certificate SHA-256: \`${CERT}\`"
          } > release-notes.md

          # One release per version: a newer build of the same version replaces it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$APK" \
            --title "PocketGLM ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
