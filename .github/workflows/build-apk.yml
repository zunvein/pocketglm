name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Build the Go bridge for android/arm64 (same as build-android.yml)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Cross-compile bridge (android/arm64)
        working-directory: .
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o app/app/src/main/assets/bridge/zai-api-android-arm64 .
          ls -la app/app/src/main/assets/bridge/

      # 2) Build the APK (debug-signed for sideloading; release signing needs a
      #    keystore secret the maintainer can add later)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: app

      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew || true
          gradle :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Report artifact
        working-directory: app
        run: ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGLM-debug-APK
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30
